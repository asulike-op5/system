[package]
name = "structural_system"
version = "0.1.0"
edition = "2021"

[dependencies]
ndarray = { version = "0.15", features = ["blas"] }
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
approx = "0.5"

[dependencies.pyo3]
version = "0.21"
features = ["extension-module"]
